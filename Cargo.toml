[workspace]
resolver = "2"
members = ["crates/mail-core", "crates/mail-testserver", "src-tauri"]
# The Tauri shell needs the platform WebView SDK (WebView2 on Windows, webkit2gtk on Linux), so the
# headless default build is the core and its test server; CI builds the shell in its own jobs.
default-members = ["crates/mail-core", "crates/mail-testserver"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/MouseWerk/arcalo-mail"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3

# Argon2id (the app lock's PIN, the password-wrapped database key) is far too slow unoptimized:
# debug builds and tests would wait seconds per hash (as in Arcalo).
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
