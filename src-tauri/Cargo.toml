[package]
name = "arcalo-mail"
description = "Arcalo Mail app shell (Tauri v2): desktop, Android and iOS"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "arcalo_mail_lib"
# staticlib: iOS; cdylib: Android; rlib: the desktop binary.
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22.1"
# The addresses of the network interfaces: a change means reconnecting (`watch_network`).
if-addrs = "0.15"
mail-core = { path = "../crates/mail-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sys-locale = "0.3.2"
tauri = { version = "2", features = ["tray-icon"] }
# Open and save dialogs for attachments.
tauri-plugin-dialog = "2"
# Desktop notifications for new mail.
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"

# The phones' background check: a runtime of its own for one round of every account.
tokio = { version = "1.53.1", features = ["rt", "sync", "time"] }

# Secrets in the OS credential store: Windows Credential Manager and the macOS Keychain.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
keyring = { version = "3", features = ["windows-native", "apple-native"] }

# Linux: the Secret Service (GNOME Keyring, KWallet) over D-Bus.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

# One window per user: a second start brings the first one to the front.
[target.'cfg(any(windows, target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

# Android (`mobile/android.rs`): the Kotlin side through JNI, also from the background check that
# runs without the app (WorkManager): the Keystore cipher, Custom Tabs, notifications.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21.1"
ndk-context = "0.1.1"

# iOS (`mobile/ios.rs`): the Keychain with items the background check can read while the phone
# is locked, and UIKit, AuthenticationServices, BackgroundTasks and UserNotifications through the
# Objective-C runtime.
[target.'cfg(target_os = "ios")'.dependencies]
block2 = "0.6.2"
dispatch2 = "0.3.1"
objc2 = "0.6.5"
security-framework = "3.7.0"

[features]
# Used by `cargo tauri build`/`dev`; debug builds without it load the Vite dev server.
custom-protocol = ["tauri/custom-protocol"]
