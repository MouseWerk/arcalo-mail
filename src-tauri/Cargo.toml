[package]
name = "arcalo-mail"
description = "Arcalo Mail app shell (Tauri v2): desktop, Android and iOS"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "arcalo_mail_lib"
# staticlib: iOS; cdylib: Android; rlib: the desktop binary.
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22.1"
mail-core = { path = "../crates/mail-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sys-locale = "0.3.2"
tauri = { version = "2", features = [] }
# Open and save dialogs for attachments.
tauri-plugin-dialog = "2"
# Desktop notifications for new mail.
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"

# Secrets in the OS credential store: Windows Credential Manager, macOS and iOS Keychain.
[target.'cfg(any(windows, target_os = "macos", target_os = "ios"))'.dependencies]
keyring = { version = "3", features = ["windows-native", "apple-native"] }

# Linux: the Secret Service (GNOME Keyring, KWallet) over D-Bus.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

# One window per user: a second start brings the first one to the front.
[target.'cfg(any(windows, target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

# Android: the Android Keystore through a small Kotlin plugin (milestone 3, docs/plan.md); until
# then `secrets.rs` refuses to store anything there.

[features]
# Used by `cargo tauri build`/`dev`; debug builds without it load the Vite dev server.
custom-protocol = ["tauri/custom-protocol"]
