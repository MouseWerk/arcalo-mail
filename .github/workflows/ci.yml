name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same branch stops the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The Microsoft (Entra) client id of Arcalo Mail, compiled into the builds below
  # (docs/microsoft.md). A repository variable, not a secret: public client ids are not secret.
  # Empty until the owner registered the app; such a build has no Microsoft sign-in.
  ARCALO_MAIL_MS_CLIENT_ID: ${{ vars.ARCALO_MAIL_MS_CLIENT_ID }}

jobs:
  checks:
    name: Format, lints, core and UI tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: System packages (WebKitGTK for the Tauri shell)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libdbus-1-dev
      - run: cargo fmt --all --check
      # Commit rules (CLAUDE.md): the owner's authorship, no co-author or session trailers. Checks
      # the commits of this push.
      - name: Commit rules
        if: github.event_name == 'push'
        env:
          COMMITS: ${{ toJSON(github.event.commits) }}
        run: node scripts/commit-rules.mjs
      # The release's scripts: the automatic release's choice of version, the APK's signer, the
      # update feed's check and the version stamp (docs/release.md); the release notes' shape, the
      # commit rules and the e2e conventions.
      - run: node --test scripts/release-pick.test.mjs scripts/apk-signer.test.mjs scripts/verify-update-feed.test.mjs scripts/set-version.test.mjs scripts/release-notes.test.mjs scripts/commit-rules.test.mjs scripts/e2e-conventions.test.mjs
      - run: npm ci --prefix ui
      - run: npm --prefix ui run typecheck
      - run: npm --prefix ui test
      # The shell embeds ui/dist at compile time, so clippy needs the built UI.
      - run: npm --prefix ui run build
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test -p mail-core -p mail-testserver -p arcalo-mail

  e2e:
    name: End-to-end tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: System packages (WebKitGTK, WebDriver, Xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libdbus-1-dev webkit2gtk-driver xvfb x11-utils dbus xdg-utils
      - run: npm ci --prefix ui
      - run: cargo install tauri-driver --locked
      # The app against the IMAP/SMTP test server on the runner (crates/mail-testserver); no
      # connection leaves the machine.
      - name: End-to-end tests against the desktop app
        run: npm ci --prefix e2e && e2e/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: e2e/screenshots

  conformance:
    name: Conformance against Dovecot and GreenMail
    runs-on: ubuntu-24.04
    services:
      # GreenMail: IMAP without QRESYNC and SMTP that delivers locally; any user signs in.
      greenmail:
        image: greenmail/standalone:2.1.14
        env:
          GREENMAIL_OPTS: -Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled -Dgreenmail.verbose
        ports:
          - 3025:3025
          - 3143:3143
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: Swatinem/rust-cache@v2
      # Dovecot 2.4 with QRESYNC, CONDSTORE, MOVE and IDLE: started here because it needs the
      # configuration file of the checkout (ci/dovecot/ci.conf).
      - name: Dovecot
        run: |
          docker run -d --name dovecot -p 31143:31143 \
            -e USER_PASSWORD='{PLAIN}conformance' \
            -v "$PWD/ci/dovecot/ci.conf:/etc/dovecot/conf.d/ci.conf:ro" \
            dovecot/dovecot:2.4.5
          for i in $(seq 1 60); do (echo > /dev/tcp/127.0.0.1/31143) 2>/dev/null && break; sleep 1; done
          for i in $(seq 1 60); do (echo > /dev/tcp/127.0.0.1/3143) 2>/dev/null && break; sleep 1; done
      - run: cargo test -p mail-testserver --test conformance --no-run
      - name: Dovecot (QRESYNC)
        env:
          ARCALO_MAIL_CONFORMANCE_IMAP: 127.0.0.1:31143
          ARCALO_MAIL_CONFORMANCE_USER: maria@example.org
          ARCALO_MAIL_CONFORMANCE_PASSWORD: conformance
        run: cargo test -p mail-testserver --test conformance -- --ignored --nocapture
      - name: GreenMail (no QRESYNC, SMTP)
        env:
          ARCALO_MAIL_CONFORMANCE_IMAP: 127.0.0.1:3143
          ARCALO_MAIL_CONFORMANCE_SMTP: 127.0.0.1:3025
          ARCALO_MAIL_CONFORMANCE_USER: maria@example.org
          ARCALO_MAIL_CONFORMANCE_PASSWORD: conformance
        run: cargo test -p mail-testserver --test conformance -- --ignored --nocapture
      - name: Server logs
        if: failure()
        run: docker logs dovecot || true

  desktop:
    name: Desktop build (${{ matrix.name }})
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            bundles: nsis
          - name: macOS
            os: macos-latest
            bundles: app,dmg
          - name: Linux
            os: ubuntu-24.04
            bundles: deb,rpm,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # SQLCipher's vendored OpenSSL is configured with Perl: Strawberry Perl of the runner (Git's
      # perl lacks modules OpenSSL needs), as in Arcalo.
      # The PowerShell scripts cannot run on Linux: Windows PowerShell 5.1 parses every one of them
      # here, and a syntax error fails the build instead of a user's installation (as in Arcalo).
      - name: PowerShell scripts parse (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $bad = 0
          Get-ChildItem -Recurse -Filter *.ps1 -Path crates, scripts, src-tauri -ErrorAction SilentlyContinue | Where-Object { $_.FullName -notmatch '\\(node_modules|target)\\' } | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors) | Out-Null
            foreach ($e in $errors) { Write-Host "$($_.FullName):$($e.Extent.StartLineNumber): $($e.Message)"; $bad++ }
          }
          if ($bad) { exit 1 }
      - name: Perl for OpenSSL (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo 'OPENSSL_SRC_PERL=C:\Strawberry\perl\bin\perl.exe' >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: System packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libdbus-1-dev
      - run: npm ci --prefix ui
      - run: cargo install tauri-cli --version "^2" --locked
      # Unsigned: no code signing certificate (docs/plan.md, owner decisions). macOS is signed ad hoc.
      # Without the update key (only the release has it) the updater stays off.
      - run: cargo tauri build --bundles ${{ matrix.bundles }}
        working-directory: src-tauri
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
      # The setup and the program start on a Windows without the Visual C++ Redistributable.
      - name: No Visual C++ runtime DLLs
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/check-windows-runtime.ps1 target/release/arcalo-mail.exe
      # Code for one system only (cfg(windows), cfg(target_os = "macos")) is only compiled here; the
      # UI is built by now (cargo tauri build), as clippy of the shell needs it.
      - name: Lints of the system-specific code
        if: runner.os != 'Linux'
        run: cargo clippy -p mail-core -p arcalo-mail --all-targets -- -D warnings
      # File handling and line ends differ on Windows (sharing, flush rights, autocrlf): the
      # encryption, file and store tests run here too, as Arcalo's backup and encryption tests do.
      - name: Core tests on Windows (encryption, files, store)
        if: runner.os == 'Windows'
        run: cargo test -p mail-core -- cipher files store
      # The update install compiled like the release (Arcalo's updater refused it only in release
      # builds): writes into a temp folder, starts nothing. Without fat LTO, still without debug
      # assertions.
      - name: Update installer in release mode (dry)
        if: runner.os != 'Linux'
        run: cargo test --release -p arcalo-mail --features custom-protocol --lib installer
        env:
          CARGO_PROFILE_RELEASE_LTO: "off"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      - uses: actions/upload-artifact@v4
        with:
          name: arcalo-mail-${{ runner.os }}
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/dmg/*.dmg
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  # The phones' builds are workflows of their own, also called by the release (release.yml).
  android:
    name: Android
    needs: checks
    uses: ./.github/workflows/android.yml
    secrets: inherit

  ios:
    name: iOS
    needs: checks
    uses: ./.github/workflows/ios.yml
    secrets: inherit
