name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same branch stops the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The Microsoft (Entra) client id of Arcalo Mail, compiled into the builds below
  # (docs/microsoft.md). A repository variable, not a secret: public client ids are not secret.
  # Empty until the owner registered the app; such a build has no Microsoft sign-in.
  ARCALO_MAIL_MS_CLIENT_ID: ${{ vars.ARCALO_MAIL_MS_CLIENT_ID }}

jobs:
  checks:
    name: Format, lints, core and UI tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: System packages (WebKitGTK for the Tauri shell)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libdbus-1-dev
      - run: cargo fmt --all --check
      - run: npm ci --prefix ui
      - run: npm --prefix ui run typecheck
      - run: npm --prefix ui test
      # The shell embeds ui/dist at compile time, so clippy needs the built UI.
      - run: npm --prefix ui run build
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test -p mail-core -p mail-testserver -p arcalo-mail

  e2e:
    name: End-to-end tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: System packages (WebKitGTK, WebDriver, Xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libdbus-1-dev webkit2gtk-driver xvfb x11-utils dbus
      - run: npm ci --prefix ui
      - run: cargo install tauri-driver --locked
      # The app against the IMAP/SMTP test server on the runner (crates/mail-testserver); no
      # connection leaves the machine.
      - name: End-to-end tests against the desktop app
        run: npm ci --prefix e2e && e2e/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: e2e/screenshots

  conformance:
    name: Conformance against Dovecot and GreenMail
    runs-on: ubuntu-24.04
    services:
      # GreenMail: IMAP without QRESYNC and SMTP that delivers locally; any user signs in.
      greenmail:
        image: greenmail/standalone:2.1.14
        env:
          GREENMAIL_OPTS: -Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled -Dgreenmail.verbose
        ports:
          - 3025:3025
          - 3143:3143
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: Swatinem/rust-cache@v2
      # Dovecot 2.4 with QRESYNC, CONDSTORE, MOVE and IDLE: started here because it needs the
      # configuration file of the checkout (ci/dovecot/ci.conf).
      - name: Dovecot
        run: |
          docker run -d --name dovecot -p 31143:31143 \
            -e USER_PASSWORD='{PLAIN}conformance' \
            -v "$PWD/ci/dovecot/ci.conf:/etc/dovecot/conf.d/ci.conf:ro" \
            dovecot/dovecot:2.4.5
          for i in $(seq 1 60); do (echo > /dev/tcp/127.0.0.1/31143) 2>/dev/null && break; sleep 1; done
          for i in $(seq 1 60); do (echo > /dev/tcp/127.0.0.1/3143) 2>/dev/null && break; sleep 1; done
      - run: cargo test -p mail-testserver --test conformance --no-run
      - name: Dovecot (QRESYNC)
        env:
          ARCALO_MAIL_CONFORMANCE_IMAP: 127.0.0.1:31143
          ARCALO_MAIL_CONFORMANCE_USER: maria@example.org
          ARCALO_MAIL_CONFORMANCE_PASSWORD: conformance
        run: cargo test -p mail-testserver --test conformance -- --ignored --nocapture
      - name: GreenMail (no QRESYNC, SMTP)
        env:
          ARCALO_MAIL_CONFORMANCE_IMAP: 127.0.0.1:3143
          ARCALO_MAIL_CONFORMANCE_SMTP: 127.0.0.1:3025
          ARCALO_MAIL_CONFORMANCE_USER: maria@example.org
          ARCALO_MAIL_CONFORMANCE_PASSWORD: conformance
        run: cargo test -p mail-testserver --test conformance -- --ignored --nocapture
      - name: Server logs
        if: failure()
        run: docker logs dovecot || true

  desktop:
    name: Desktop build (${{ matrix.name }})
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            bundles: nsis
          - name: macOS
            os: macos-latest
            bundles: app,dmg
          - name: Linux
            os: ubuntu-24.04
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: System packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libdbus-1-dev
      - run: npm ci --prefix ui
      - run: cargo install tauri-cli --version "^2" --locked
      # Unsigned: no code signing certificate (docs/plan.md, owner decisions). macOS is signed ad hoc.
      - run: cargo tauri build --bundles ${{ matrix.bundles }}
        working-directory: src-tauri
      - uses: actions/upload-artifact@v4
        with:
          name: arcalo-mail-${{ runner.os }}
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/dmg/*.dmg
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  android:
    name: Android build (unsigned APK)
    needs: checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # The runner brings the Android SDK and NDK (as in Arcalo's Android build).
      - name: Android NDK (preinstalled on the runner)
        run: |
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "Using the NDK in $ANDROID_NDK_LATEST_HOME"
          bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "$bin" >> "$GITHUB_PATH"
          for t in aarch64_linux_android armv7_linux_androideabi x86_64_linux_android i686_linux_android; do
            echo "AR_$t=$bin/llvm-ar" >> "$GITHUB_ENV"
            echo "RANLIB_$t=$bin/llvm-ranlib" >> "$GITHUB_ENV"
          done
      - run: npm ci --prefix ui
      - run: cargo install tauri-cli --version "^2" --locked
      # The Android project (src-tauri/gen/android) is generated until it needs own changes
      # (the Keystore plugin of milestone 3); then it is committed as in Arcalo.
      - run: cargo tauri android init --ci
        working-directory: src-tauri
      - run: cargo tauri android build --apk --ci
        working-directory: src-tauri
      - uses: actions/upload-artifact@v4
        with:
          name: arcalo-mail-android
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  ios:
    name: iOS build
    needs: checks
    runs-on: macos-latest
    env:
      # Set as a repository secret once the Apple Developer Program membership exists (docs/plan.md).
      APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix ui && npm --prefix ui run build
      # Without signing: the Rust library for the device and the simulator must compile, so iOS
      # code paths cannot rot while there is no Apple developer account.
      - name: Rust library for iOS (no signing needed)
        run: |
          cargo build -p arcalo-mail --lib --target aarch64-apple-ios
          cargo build -p arcalo-mail --lib --target aarch64-apple-ios-sim
      - name: Xcode project and app (needs signing)
        if: env.APPLE_DEVELOPMENT_TEAM != ''
        working-directory: src-tauri
        run: |
          cargo install tauri-cli --version "^2" --locked
          cargo tauri ios init --ci
          cargo tauri ios build --ci
      - name: Signing not set up
        if: env.APPLE_DEVELOPMENT_TEAM == ''
        run: |
          echo "::notice::tauri ios build skipped: no APPLE_DEVELOPMENT_TEAM secret (iOS signing needs the paid Apple Developer Program, see docs/plan.md)."
