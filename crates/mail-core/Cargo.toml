[package]
name = "mail-core"
description = "Local-first core of Arcalo Mail: accounts, the local store with full-text search, parsing, HTML sanitizing, the IMAP and SMTP clients, the sync engine, the calendar and signed and encrypted mail"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# The in-memory IMAP server (`imap::fake`) for tests of other crates (the wire test server in
# `crates/mail-testserver`, the shell).
fake = []

[dependencies]
# S/MIME content encryption (AES-CBC), as CMS uses it.
aes = "0.8.4"
# Encryption on the device, as in Arcalo: the PIN hash of the app lock and the database key wrapped
# with a password (Argon2id, AES-256-GCM); the recovery key in base32; keys wiped from memory.
aes-gcm = "0.10.3"
argon2 = "0.5.3"
data-encoding = "2.11.1"
getrandom = "0.3.4"
zeroize = "1.8"
# HTML mail: allow-list sanitizing; remote content is removed unless the user allows it.
ammonia = "4.1.7"
base64 = "0.22.1"
cbc = { version = "0.1.2", features = ["alloc", "block-padding"] }
# Calendar times: zones (IANA, Windows names, VTIMEZONE rules) and series, as in Arcalo.
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
# S/MIME: CMS signed and enveloped data (RFC 5652), certificates, RSA (`crypto::smime`).
cms = { version = "0.2.3", features = ["builder"] }
const-oid = { version = "0.9.6", features = ["db"] }
der = { version = "0.7.10", features = ["alloc", "oid"] }
# SRV (RFC 6186) and MX lookups for the account setup, with the system's resolver settings.
hickory-resolver = { version = "0.26.3", default-features = false, features = ["tokio", "system-config"] }
# The device's zone by its IANA name, for appointments written here.
iana-time-zone = "0.1.65"
# HTML's tokenizer (the one ammonia parses with): the tracking pixels are found on the tags as a
# browser reads them.
html5ever = "0.40.1"
# Internationalized domain names (punycode) of senders, read for the phishing warning.
idna = "1.1.0"
# The IMAP response parser; the client (`imap::client`) and its commands are our own.
imap-proto = "0.17.0"
# SMTP once the connection stands (`network` does TCP, TLS and STARTTLS itself).
lettre = { version = "0.11.23", default-features = false, features = ["smtp-transport", "tokio1"] }
mail-builder = "0.4.4"
mail-parser = "0.11.9"
# The signatures of update files (minisign, the key of the Tauri updater), as in Arcalo.
minisign-verify = "0.2.5"
# imap-proto's parser combinators: tells a half-received answer from a broken one.
nom = "8.0.0"
# The user's S/MIME certificate and key from a PKCS#12 file.
p12-keystore = "0.1.5"
# OpenPGP (rPGP): keys, PGP/MIME signatures and encryption, Autocrypt (`crypto::pgp`).
pgp = "0.21.0"
# Random UIDs and keys (the generator OpenPGP takes).
rand = "0.8.5"
# HTTPS for the autoconfig lookups (`network::client_for`), rustls with the platform verifier.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "socks"] }
roxmltree = "0.20.0"
# Recurrence rules of series (RFC 5545), as in Arcalo.
rrule = "0.14.0"
rsa = { version = "0.9.10", features = ["sha2"] }
# The local store: SQLCipher with FTS5, as Arcalo; a plain database opens unchanged and is encrypted
# only when the user switches it on (`cipher`). The crypto library per platform is below.
rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher"] }
rustls = { version = "0.23.43", default-features = false, features = ["std", "aws_lc_rs", "tls12"] }
rustls-platform-verifier = "0.6.2"
# Versions of the update feeds.
semver = "1.0.27"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# The Web Key Directory's hash (SHA-1 of the address's local part), S/MIME's older digests.
sha1 = "0.10.6"
sha2 = "0.10.9"
spki = "0.7.3"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt", "net", "io-util", "time", "macros", "sync"] }
tokio-rustls = { version = "0.26.5", default-features = false, features = ["aws_lc_rs", "tls12"] }
# Tracker removal reads and rebuilds link addresses (`tracking`).
url = "2.5.8"
# S/MIME certificate chains to the system's roots (the same verifier TLS uses).
webpki = { package = "rustls-webpki", version = "0.103.15" }
x509-cert = "0.2.5"

# The system proxy of the Windows Internet settings (`network::system_proxy`).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Registry"] }

# Android: Mozilla's root store for TLS (`network::platform_verifier`), as in Arcalo's companion app,
# and for S/MIME on both phones.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
webpki-root-certs = "1.0.9"

# SQLCipher's crypto: macOS and iOS use CommonCrypto (part of the system); Windows, Linux and Android
# link a vendored static OpenSSL, so users need no OpenSSL. Building it needs Perl and make (the CI
# runners have them; Windows takes Strawberry Perl, see ci.yml), as in Arcalo.
[target.'cfg(not(any(target_os = "macos", target_os = "ios")))'.dependencies]
rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher-vendored-openssl"] }

# The system's root certificates for S/MIME on the desktop.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
rustls-native-certs = "0.8.5"

[dev-dependencies]
# Test certificates for S/MIME (an authority and a user's certificate, made per test).
rcgen = { version = "0.14.10", features = ["aws_lc_rs"] }
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "macros"] }
